[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.13"]
build-backend = "scikit_build_core.build"

[project]
name = "weft-core"
version = "0.1.0"
description = "Shared Canonical kernel compiler and native runtime for embedded DSLs"
requires-python = ">=3.10"
license = {file = "LICENSE"}

[tool.scikit-build]
wheel.packages = ["python/weft_core"]
cmake.args = ["-DWEFT_INSTALL_ROOT=weft_core", "-DWEFT_BUILD_PYTHON=ON"]
sdist.exclude = [".local", "__pycache__"]
