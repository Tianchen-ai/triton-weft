<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="536" viewBox="0 0 1536 536">
<title>Two implementations of one operator and two ways to author the selected one</title>
<desc>A familiar operator matmul(X, W) hides two implementation choices that use X: expanding the packed weights before computing Y, or preparing a weight region and reusing it for several output computations. The selected choice is authored either by assembling it from existing authoring objects (block programs, SIMD, intrinsics) or directly as a Weft program whose compiler performs the machine mapping. Both routes reach the same x86 and RISC-V CPUs.</desc>
