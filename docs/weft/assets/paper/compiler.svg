<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="526" viewBox="0 0 1536 526">
<title>Compiler architecture for Weft programs</title>
<desc>The Triton front end with Weft semantics produces Canonical Kernel IR that keeps the shared value wp and state s with their scope, axes, types and encoding. Compilation then branches into separate x86 and RISC-V physical programs, each given its own target profile; x86 emits LLVM IR and RISC-V emits intrinsic C with local assembly.</desc>
